<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楼里 · 城西银泰空间地图</title><link rel="stylesheet" href="styles/spatial-map.css"><link rel="stylesheet" href="styles/brand-logo.css"><link rel="stylesheet" href="styles/site-nav.css"></head>
<body><main class="spatial-app">
  <header class="spatial-header"><a class="brand louli-brand" href="./?venue=yintai-demo#showcase" aria-label="楼里首页"><span class="brand-logo" aria-hidden="true"></span><span class="brand-name">LOULI</span></a><div class="site-nav-slot" data-site-nav></div></header>
  <section class="spatial-toolbar" aria-label="地图操作"><div class="toolbar-title"><small>HANGZHOU · YINTAI</small><h1>城西银泰 · 1F</h1></div><div class="toolbar-actions"><button id="overviewBtn" class="mode-btn active" type="button" aria-pressed="true">1F 平面图</button><button id="photoBtn" class="mode-btn" type="button" aria-pressed="false" disabled>对照原图</button><label class="shop-search"><span class="visually-hidden">搜索店铺</span><input id="shopSearch" type="search" placeholder="搜索图上店铺" autocomplete="off"></label></div></section>
  <nav class="floor-nav" aria-label="当前楼层"><button data-floor="1F" type="button">1F</button><span class="single-floor-note">当前接入单层导览照片数据</span></nav>
  <div id="searchResults" class="search-results" hidden></div>
  <section class="spatial-workspace" aria-label="城西银泰1F店铺地图"><div class="map-canvas"><div id="stackView" class="stack-view" aria-label="五层立体概览"><div class="stack-guides" aria-hidden="true"></div><div id="stackLayers" class="stack-layers"></div><div class="stack-caption"><span>01—05 / FLOORS</span><strong>点击任一楼层，进入平面图</strong></div></div><div id="planView" class="plan-view" hidden><div class="plan-heading"><div><span id="planFloor">1F</span><p>色块边界按照片重绘，位置仅供展示</p></div><button id="backToStack" type="button">↗ 1F 平面图</button></div><svg id="planSvg" viewBox="40 215 1520 880" role="img" aria-label="所选楼层的店铺相对位置和轮廓"></svg></div></div><aside class="spatial-inspector"><div class="inspector-kicker">SPACE INDEX / 01</div><div id="inspectorBody"><span class="inspector-floor">B1 — 4F</span><h2>从铺位到楼层，<br>建立空间印象。</h2><p>从商场导览屏照片提取颜色区域、店名和图上相对位置。选一个楼层或搜索店名查看细节。</p></div><div class="inspector-bottom"><div class="count-row"><strong id="zoneTotal">—</strong><span>色块区域</span><strong id="shopTotal">—</strong><span>店名记录</span></div><a href="reference-map.html?venue=yintai-demo" id="publicMapLink">查看另一套公开楼层视图 ↗</a></div></aside></section>
</main><script type="module" src="js/spatial-map.js"></script><script type="module" src="js/site-nav.js"></script><script type="module" src="js/click-spark.js"></script></body></html>
