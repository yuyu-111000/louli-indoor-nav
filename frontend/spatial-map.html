<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楼里 · 城西银泰空间地图</title><link rel="stylesheet" href="styles/spatial-map.css"></head>
<body><main class="spatial-app">
  <header class="spatial-header"><a class="spatial-brand" href="./">楼里 <span>LOULI</span></a><div><strong>城西银泰 · 空间地图</strong><small>导览屏照片提取 · 展示原型</small></div><a class="back-link" href="./">返回产品展示 ↗</a></header>
  <section class="spatial-toolbar" aria-label="地图操作"><div class="toolbar-title"><small>HANGZHOU · YINTAI</small><h1>五层，一眼看见。</h1></div><div class="toolbar-actions"><button id="overviewBtn" class="mode-btn active" type="button" aria-pressed="true">立体总览</button><button id="photoBtn" class="mode-btn" type="button" aria-pressed="false" disabled>对照原图</button><label class="shop-search"><span class="visually-hidden">搜索店铺</span><input id="shopSearch" type="search" placeholder="搜索图上店铺" autocomplete="off"></label></div></section>
  <nav class="floor-nav" aria-label="楼层"><button data-floor="B1" type="button">B1</button><button data-floor="1F" type="button">1F</button><button data-floor="2F" type="button">2F</button><button data-floor="3F" type="button">3F</button><button data-floor="4F" type="button">4F</button></nav>
  <div id="searchResults" class="search-results" hidden></div>
  <section class="spatial-workspace" aria-label="城西银泰五层店铺地图"><div class="map-canvas"><div id="stackView" class="stack-view" aria-label="五层立体概览"><div class="stack-guides" aria-hidden="true"></div><div id="stackLayers" class="stack-layers"></div><div class="stack-caption"><span>01—05 / FLOORS</span><strong>点击任一楼层，进入平面图</strong></div></div><div id="planView" class="plan-view" hidden><div class="plan-heading"><div><span id="planFloor">1F</span><p>色块边界按照片重绘，位置仅供展示</p></div><button id="backToStack" type="button">↗ 立体总览</button></div><svg id="planSvg" viewBox="40 215 1520 880" role="img" aria-label="所选楼层的店铺相对位置和轮廓"></svg><div class="plan-footnote"><span id="planCount"></span><span>浅色通道仅作视觉留白，不代表已测绘路线</span></div></div></div><aside class="spatial-inspector"><div class="inspector-kicker">SPACE INDEX / 01</div><div id="inspectorBody"><span class="inspector-floor">B1 — 4F</span><h2>从铺位到楼层，<br>建立空间印象。</h2><p>从商场导览屏照片提取颜色区域、店名和图上相对位置。选一个楼层或搜索店名查看细节。</p></div><div class="inspector-bottom"><div class="count-row"><strong id="zoneTotal">—</strong><span>色块区域</span><strong id="shopTotal">—</strong><span>店名记录</span></div><p>照片提取稿 · 不含实际比例、店门、通路或定位精度。名称与营业状态需场馆复核。</p><a href="reference-map.html?venue=yintai-demo" id="publicMapLink">查看另一套公开楼层视图 ↗</a></div></aside></section>
</main><script type="module" src="js/spatial-map.js"></script></body></html>
