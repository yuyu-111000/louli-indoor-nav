<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楼里 · 室内导航产品展示</title><link rel="preload" href="assets/fonts/louli-ui-sans.woff" as="font" type="font/woff" crossorigin><link rel="stylesheet" href="styles/showcase.css"><link rel="stylesheet" href="styles/typography.css"><link rel="stylesheet" href="styles/launch.css"><link rel="stylesheet" href="styles/jelly-nav.css"><link rel="stylesheet" href="styles/brand-logo.css"><link rel="stylesheet" href="styles/story-stepper.css"><link rel="stylesheet" href="styles/glide-select.css"><link rel="stylesheet" href="styles/showcase-venue.css"><link rel="stylesheet" href="styles/care-mode.css"><script src="js/care-mode.js"></script></head>
<body>
<section class="launch" id="launch" aria-label="楼里启动页" hidden>
  <div class="launch-track">
    <div class="launch-stage">
      <div class="launch-frame">
        <img class="launch-media" src="assets/launch-wayfinding.svg" alt="" aria-hidden="true" fetchpriority="high">
        <div class="launch-scrim" aria-hidden="true"></div>
        <div class="launch-overlay" aria-hidden="true" inert>
          <h2 class="launch-message" aria-label="在楼里，知道下一步去哪里"><span>在楼里，</span><span>知道下一步</span><span class="launch-accent">去哪里</span></h2>
          <a class="launch-enter" href="#showcase">进入楼里 <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="launch-topline"><a class="louli-brand" href="#showcase" aria-label="进入楼里"><span class="brand-logo" aria-hidden="true"></span><span class="brand-name">LOULI</span></a><a class="launch-skip" href="#showcase">跳过开场 <span aria-hidden="true">↗</span></a></div>
      <h1 class="launch-wordmark"><img src="assets/logo.svg" alt="楼里" width="444" height="262" fetchpriority="high"></h1>
      <div class="launch-hint" aria-hidden="true"><span class="launch-hint-arrow">↓</span></div>
    </div>
  </div>
</section>
<header class="site-header" id="showcase" tabindex="-1"><a class="brand louli-brand" href="./" aria-label="楼里首页"><span class="brand-logo" aria-hidden="true"></span><span class="brand-name">LOULI</span></a><nav aria-label="展示导航"><a href="demo.html" id="exploreLink">逐层看图</a><a href="demo.html?venue=yintai-demo" id="simulationNavLink">路线仿真</a><a href="data-console.html">演示数据</a><a href="nearby.html" id="nearbyBtn">附近场馆</a><a href="materials.html" id="materialsBtn">资料与反馈</a></nav></header>
<main class="showcase">
  <aside class="story-panel">
    <div class="eyebrow">INDOOR WAYFINDING</div>
    <h1>在楼里，<br>知道下一步<br><em>去哪里。</em></h1>
    <div class="scene-switch" aria-label="场景"><button data-venue="hosp" aria-pressed="true">医院就诊</button><button data-venue="mall" aria-pressed="false">商场导航</button></div>
    <section class="story-stepper" aria-label="四步功能引导"><div class="stepper-inner">
      <div class="stepper-heading"><span>功能体验</span><span id="chapterNumber">01 / 04</span></div>
      <nav class="stepper-indicators" id="progress" aria-label="选择演示步骤"></nav>
      <div class="stepper-content" id="stepContent" aria-live="polite" aria-atomic="true">
        <h2 id="chapterTitle">正在加载场馆</h2>
        <p id="stepHint"></p>
        <fieldset class="destination-choices" id="destinationChoices"><legend>想去哪里？</legend></fieldset>
      </div>
      <div class="stepper-controls">
        <div class="stepper-play-slot" id="playSlot" hidden><button class="stepper-play" id="playBtn" aria-pressed="false" disabled><span aria-hidden="true">▶</span><span>播放功能演示</span></button></div>
        <div class="stepper-navigation"><button id="backBtn" disabled>← 上一步</button><button id="nextBtn" disabled>下一步 →</button></div>
      </div>
      <div class="stepper-footer" id="restartSlot" hidden><button id="restartBtn" disabled><span aria-hidden="true">↺</span> 重新开始</button></div>
    </div></section>
  </aside>
  <section class="map-stage" aria-label="地图功能演示">
    <label class="showcase-venue" for="venueSelect"><span>当前场馆</span><select id="venueSelect" aria-label="选择展示场馆" disabled><option>正在读取场馆…</option></select></label>
    <div class="stage-heading"><div><small id="venueType" hidden></small><h2 id="venueName">示例门诊楼</h2></div><span id="apiStatus" hidden aria-hidden="true"></span></div>
    <div id="placeSummary" class="place-summary" hidden><span id="placeSummaryText"></span><a id="placeMapLink" target="_blank" rel="noopener noreferrer">查看室外地点 ↗</a></div><iframe id="referenceFrame" class="map-frame" title="公开楼层图与图上店铺标注" inert aria-hidden="true"></iframe><iframe id="demoFrame" class="map-frame is-visible" title="室内地图与导航仿真演示"></iframe>
    <div class="map-footer"><span id="floorNote">地图可拖动与缩放</span><span id="demoFeature">流程导航 / 地标指引 / 返回提醒</span></div>
  </section>
</main>
<script type="module" src="js/launch.js"></script><script type="module" src="js/showcase.js"></script><script type="module" src="js/jelly-nav.js"></script>
<script type="module" src="js/click-spark.js"></script></body></html>
